[project]
name = "langton-lab"
version = "0.1.0"
description = "Interactive simulator of Langton's Ant and other cellular automata."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alassana Djigo" }]
dependencies = [
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
]

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "DJ", "PT", "S", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "apps", "config"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "-ra --strict-markers --strict-config"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"

[tool.coverage.run]
source = ["engine", "apps", "config"]
omit = ["config/wsgi.py", "*/migrations/*"]
